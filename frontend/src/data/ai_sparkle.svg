<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Clip path for the main soft sparkle star -->
    <clipPath id="main-star-clip">
      <path d="M 45,10 
               C 49,25 57,36 78,42 
               C 57,48 49,59 45,74 
               C 41,59 33,48 12,42 
               C 33,36 41,25 45,10 Z" />
    </clipPath>

    <!-- Clip path for the smaller sparkle star -->
    <clipPath id="small-star-clip">
      <path d="M 72,56 
               C 74,65 79,71 89,74 
               C 79,77 74,83 72,92 
               C 70,83 65,77 55,74 
               C 65,71 70,65 72,56 Z" />
    </clipPath>
  </defs>


  <!-- MAIN SPARKLE -->
  <g clip-path="url(#main-star-clip)">
    <!-- Base Teal/Cyan Fill -->
    <rect x="0" y="0" width="100" height="100" fill="#52D1F7" />

    <!-- Right Side Teal Inner Shadow/Shading -->
    <path d="M 45,10 C 57,36 78,42 78,42 C 57,48 45,74 45,74 C 45,74 53,50 78,42 C 55,38 45,10 45,10 Z" fill="#3DB3DC" />

    <!-- Diagonal Purple Stripe -->
    <polygon points="0,48 55,0 75,0 0,65" fill="#9C6FE4" />

    <!-- Diagonal Pink Stripe -->
    <polygon points="0,38 43,0 58,0 0,51" fill="#EE5CA0" />

    <!-- Top-Left Red Tip -->
    <polygon points="0,26 30,0 45,0 0,39" fill="#FF3B56" />

    <!-- Specular White Gloss/Highlight -->
    <path d="M 27,25 C 29,18 36,18 38,20 C 40,22 36,29 31,31 C 28,32 25,29 27,25 Z" fill="#FFFFFF" opacity="0.95" />
  </g>

  <!-- SMALL SPARKLE -->
  <g clip-path="url(#small-star-clip)">
    <!-- Base Purple Fill -->
    <rect x="0" y="0" width="100" height="100" fill="#9C6FE4" />

    <!-- Diagonal Pink Stripe -->
    <polygon points="50,85 85,50 98,62 62,98" fill="#EE5CA0" />

    <!-- Bottom-Right Red Tip -->
    <polygon points="58,92 92,58 100,66 66,100" fill="#FF3B56" />
  </g>
</svg>
